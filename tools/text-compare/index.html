<style>
  /* Self-hosted brand face — variable weight 200–800.
     NB: confirm this src path matches the existing font location on stafferton.digital;
     the file is already hosted site-wide, so point at it rather than re-uploading. */
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("/fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #ffffff;
    --fg: #16222b;
    --muted-fg: #5b6b75;
    --secondary: #f4f6f7;
    --secondary-30: #f8fafb;
    --border: #e4e8ea;
    --accent: #009ab9;
    --accent-fg: #ffffff;
    --accent-soft: rgba(0,154,185,.10);
    --accent-border: rgba(0,154,185,.22);
    --add-bg: #e7f6ec;
    --add-fg: #1a7f3c;
    --del-bg: #fdecec;
    --del-fg: #c0392b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --line-height: 1.6;
    --header-h: 60px;
  }
  html.dark {
    --bg: #0e171d;
    --fg: #eef3f5;
    --muted-fg: #8aa0ab;
    --secondary: #18242b;
    --secondary-30: #131e24;
    --border: #243640;
    --accent: #1cb3d4;
    --accent-fg: #06222c;
    --accent-soft: rgba(28,179,212,.16);
    --accent-border: rgba(28,179,212,.32);
    --add-bg: rgba(46,160,87,.18);
    --add-fg: #5fd483;
    --del-bg: rgba(220,80,70,.18);
    --del-fg: #ff8a80;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--accent-soft); }

  /* ---------- Header ---------- */
  .header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding: 0 16px;
    min-height: var(--header-h);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-mark {
    width: 22px; height: 22px; flex: none;
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-text h1 {
    font-size: 17px; font-weight: 650; letter-spacing: -0.01em;
    margin: 0; line-height: 1.1;
  }
  .brand-text p { margin: 1px 0 0; font-size: 12px; color: var(--muted-fg); }

  .nav-group { display: flex; align-items: center; gap: 6px; }
  .badge {
    font-size: 12px; font-weight: 550; padding: 4px 10px;
    border: 1px solid var(--border); color: var(--muted-fg);
    white-space: nowrap;
  }
  .badge.has-diff { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); }
  .counter { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; min-width: 42px; text-align: center; }

  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 10px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border);
    font-size: 12.5px; font-weight: 500;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--secondary); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn.ghost { border-color: transparent; }
  .btn.ghost:hover { border-color: var(--border); }
  .btn.active { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
  .btn svg { width: 15px; height: 15px; flex: none; }

  /* ---------- Options bar ---------- */
  .options {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 9px 16px;
    background: var(--secondary-30);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .options label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted-fg); }
  .options input { accent-color: var(--accent); width: 15px; height: 15px; }
  .options .hint { margin-left: auto; font-size: 12px; color: var(--muted-fg); opacity: .8; }

  /* ---------- Panes ---------- */
  .panes {
    flex: 1 1 auto;
    display: grid; grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--border); }
  .pane:last-child { border-right: 0; }

  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    height: 40px; padding: 0 12px; flex: none;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .pane-label { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }
  .pane-actions { display: flex; gap: 4px; }

  .pane-body {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    display: flex;
    background: var(--bg);
  }
  .gutter {
    flex: none; user-select: none;
    background: var(--secondary-30);
    border-right: 1px solid var(--border);
    color: var(--muted-fg);
    font-family: var(--mono); font-size: 12.5px; line-height: var(--line-height);
    text-align: right;
    padding: 14px 10px 40px;
    white-space: pre;
    min-width: 42px;
  }
  .content-wrap { flex: 1 1 auto; min-width: 0; display: flex; }
  textarea.editor {
    display: block; width: 100%; min-height: 100%;
    border: 0; outline: 0; resize: none;
    background: transparent; color: var(--fg);
    font-family: var(--mono); font-size: 13px; line-height: var(--line-height);
    padding: 14px 14px 40px;
    overflow: hidden;
  }
  textarea.editor::placeholder { color: var(--muted-fg); opacity: .7; }
  .diffview {
    font-family: var(--mono); font-size: 13px; line-height: var(--line-height);
    padding: 14px 14px 40px; width: 100%; min-height: 100%;
    white-space: pre-wrap; word-break: break-word;
    color: var(--fg);
  }
  .diff-added { background: var(--add-bg); color: var(--add-fg); padding: 0 1px; border-radius: 2px; }
  .diff-removed { background: var(--del-bg); color: var(--del-fg); padding: 0 1px; border-radius: 2px; text-decoration: line-through; }
  .diff-equal { color: var(--fg); }
  [data-diff-index].is-current { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Overlay + floating button ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(3px);
    color: var(--muted-fg); font-size: 13px;
  }
  .overlay.show { display: flex; }
  .spinner { width: 28px; height: 28px; color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .compare-btn {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 45; display: none;
    height: 46px; padding: 0 26px;
    background: var(--accent); color: var(--accent-fg);
    border: 0; font-size: 14px; font-weight: 600; letter-spacing: .01em;
    box-shadow: 0 8px 24px -6px rgba(0,154,185,.45), 0 2px 6px rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .compare-btn.show { display: inline-flex; align-items: center; gap: 8px; }
  .compare-btn:hover { box-shadow: 0 12px 30px -6px rgba(0,154,185,.55), 0 3px 8px rgba(0,0,0,.16); transform: translateX(-50%) translateY(-1px); }
  .compare-btn:active { transform: translateX(-50%); }

  /* ---------- Footer ---------- */
  .footer {
    flex: none; text-align: center; padding: 10px 16px;
    border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted-fg);
  }
  .footer a { color: var(--muted-fg); text-decoration: none; border-bottom: 1px solid var(--border); }
  .footer a:hover { color: var(--accent); }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--fg); color: var(--bg);
    font-size: 13px; padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    animation: toast-in .18s ease;
  }
  .toast.error { background: var(--del-fg); color: #fff; }
  .toast svg { width: 15px; height: 15px; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 767px) {
    .panes { grid-template-columns: 1fr; }
    .pane { border-right: 0; border-bottom: 1px solid var(--border); }
    .label-text { display: none; }
    .brand-text p { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

<header class="header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2"  y="13" width="4" height="9" rx="0" fill="var(--accent)"/>
        <rect x="8"  y="9"  width="4" height="13" rx="0" fill="var(--accent)"/>
        <rect x="14" y="5"  width="4" height="17" rx="0" fill="currentColor" opacity=".55"/>

    <span id="counter" class="counter" hidden></span>
    <button id="nextBtn" class="btn icon" title="Next difference" hidden aria-label="Next difference">

  </div>

    <button id="clearAllBtn" class="btn" title="Clear both panes" hidden>

</header>

<div id="optionsBar" class="options">

  <label><input type="checkbox" id="optCase"> Ignore case</label>

  <span class="hint">Paste text into both panes, then compare.</span>
</div>

<main class="panes">
  <section class="pane" id="leftPane">
    <div class="pane-head">
      <span class="pane-label">Original text</span>
      <div class="pane-actions">
        <button class="btn ghost icon copyBtn" data-side="left" title="Copy original text" hidden></button>
        <button class="btn ghost icon clearBtn" data-side="left" title="Clear original text" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="pane-body" id="leftBody">
      <div class="gutter" id="leftGutter" hidden></div>
      <div class="content-wrap">
        <textarea class="editor" id="leftText" spellcheck="false" placeholder="Paste your original text here…"></textarea>
        <div class="diffview" id="leftDiff" hidden></div>
      </div>
    </div>
  </section>

  <section class="pane" id="rightPane">
    <div class="pane-head">
      <span class="pane-label">Modified text</span>
      <div class="pane-actions">
        <button class="btn ghost icon copyBtn" data-side="right" title="Copy modified text" hidden></button>
        <button class="btn ghost icon clearBtn" data-side="right" title="Clear modified text" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="pane-body" id="rightBody">
      <div class="gutter" id="rightGutter" hidden></div>
      <div class="content-wrap">
        <textarea class="editor" id="rightText" spellcheck="false" placeholder="Paste your modified text here…"></textarea>
        <div class="diffview" id="rightDiff" hidden></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  A free tool by <a href="https://stafferton.digital/" target="_blank" rel="noopener">Stafferton</a> · Runs entirely in your browser — nothing is uploaded.
</footer>

<button id="compareBtn" class="compare-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8-18h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3"/></svg>
  Compare texts
</button>

<div id="overlay" class="overlay">
  <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <span>Analysing differences…</span>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function () {
  "use strict";

  // ---- Icon markup (lucide-style) ----
  const ICONS = {
    sun:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    unlink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.84 12.25l1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71M5.17 11.75l-1.72 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71M8 2v3M2 8h3M16 22v-3M22 16h-3"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'
  };

  const $ = (id) => document.getElementById(id);

  // ---- State ----
  const state = {
    showDiff: false,
    isComparing: false,
    diffCount: 0,
    syncScroll: true,
    currentDiffIndex: 0,
  };
  let diffEls = [];
  let isSyncing = false;

  // ---- Elements ----
  const leftText = $("leftText"), rightText = $("rightText");
  const leftDiff = $("leftDiff"), rightDiff = $("rightDiff");
  const leftGutter = $("leftGutter"), rightGutter = $("rightGutter");
  const leftBody = $("leftBody"), rightBody = $("rightBody");
  const optWhitespace = $("optWhitespace"), optCase = $("optCase"), optLineBreaks = $("optLineBreaks");
  const optionsBar = $("optionsBar");
  const compareBtn = $("compareBtn"), overlay = $("overlay");
  const diffBadge = $("diffBadge"), counter = $("counter"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
  const clearAllBtn = $("clearAllBtn");
  const themeBtn = $("themeBtn"), syncBtn = $("syncBtn"), syncIcon = $("syncIcon"), syncLabel = $("syncLabel");

  // ---- Theme ----
  function applyTheme(t) {
    document.documentElement.classList.toggle("dark", t === "dark");
    themeBtn.innerHTML = (t === "dark") ? ICONS.sun : ICONS.moon;
  }
  let theme = "light";
  try { theme = localStorage.getItem("textcompare-theme") || "light"; } catch (e) {}
  applyTheme(theme);
  themeBtn.addEventListener("click", function () {
    theme = (theme === "dark") ? "light" : "dark";
    applyTheme(theme);
    try { localStorage.setItem("textcompare-theme", theme); } catch (e) {}
  });

  // ---- Sync scroll toggle ----
  function renderSync() {
    syncBtn.classList.toggle("active", state.syncScroll);
    syncIcon.innerHTML = state.syncScroll ? ICONS.link : ICONS.unlink;
    syncLabel.textContent = state.syncScroll ? "Sync on" : "Sync off";
  }
  renderSync();
  syncBtn.addEventListener("click", function () { state.syncScroll = !state.syncScroll; renderSync(); });

  // ---- Helpers ----
  function hasText() { return leftText.value.trim() !== "" || rightText.value.trim() !== ""; }

  function preprocess(text) {
    let t = text;
    if (optCase.checked)        t = t.toLowerCase();
    if (optLineBreaks.checked)  t = t.replace(/\r?\n/g, " ");
    if (optWhitespace.checked)  t = t.replace(/\s+/g, " ").trim();
    return t;
  }

  function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight, 0) + "px"; }

  function lineCount(text) { return text.length ? text.split("\n").length : 1; }
  function renderGutter(gutter, text) {
    const n = lineCount(text);
    let s = "";
    for (let i = 1; i <= n; i++) s += i + "\n";
    gutter.textContent = s;
  }

  function updateChrome() {
    const has = hasText();
    // per-pane copy/clear
    document.querySelectorAll('.copyBtn[data-side="left"], .clearBtn[data-side="left"]').forEach(b => b.hidden = leftText.value === "");
    document.querySelectorAll('.copyBtn[data-side="right"], .clearBtn[data-side="right"]').forEach(b => b.hidden = rightText.value === "");
    clearAllBtn.hidden = !has;
    // gutters (edit mode)
    if (!state.showDiff) {
      leftGutter.hidden = leftText.value === "";
      rightGutter.hidden = rightText.value === "";
      if (!leftGutter.hidden) renderGutter(leftGutter, leftText.value);
      if (!rightGutter.hidden) renderGutter(rightGutter, rightText.value);
    }
    // floating compare button
    compareBtn.classList.toggle("show", has && !state.showDiff && !state.isComparing);
  }

  // ---- Input handlers (edit mode) ----
  [leftText, rightText].forEach(function (ta) {
    ta.addEventListener("input", function () {
      autoGrow(ta);
      updateChrome();
    });
  });

  // ---- Copy ----
  function setCopyIcon(btn, copied) {
    btn.innerHTML = copied ? ICONS.check : ICONS.copy;
  }
  document.querySelectorAll(".copyBtn").forEach(function (btn) {
    setCopyIcon(btn, false);
    btn.addEventListener("click", function () {
      const side = btn.dataset.side;
      const text = side === "left" ? leftText.value : rightText.value;
      const label = side === "left" ? "Original" : "Modified";
      navigator.clipboard.writeText(text).then(function () {
        setCopyIcon(btn, true);
        toast(label + " text copied to clipboard", false);
        setTimeout(function () { setCopyIcon(btn, false); }, 2000);
      }).catch(function () { toast("Couldn’t copy — your browser blocked clipboard access", true); });
    });
  });

  // ---- Clear ----
  function resetDiffState() {
    state.showDiff = false; state.isComparing = false;
    state.diffCount = 0; state.currentDiffIndex = 0;
    diffEls = [];
    leftDiff.hidden = true; rightDiff.hidden = true;
    leftText.style.display = ""; rightText.style.display = "";
    optionsBar.style.display = "";
    diffBadge.hidden = true; counter.hidden = true; prevBtn.hidden = true; nextBtn.hidden = true;
  }
  document.querySelectorAll(".clearBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const side = btn.dataset.side;
      if (side === "left") { leftText.value = ""; autoGrow(leftText); }
      else { rightText.value = ""; autoGrow(rightText); }
      if (state.showDiff) resetDiffState();
      updateChrome();
    });
  });
  clearAllBtn.addEventListener("click", function () {
    leftText.value = ""; rightText.value = "";
    autoGrow(leftText); autoGrow(rightText);
    resetDiffState();
    leftGutter.hidden = true; rightGutter.hidden = true;
    updateChrome();
  });

  // ---- Diff rendering ----
  function span(cls, text, idx) {
    const s = document.createElement("span");
    s.className = cls;
    s.textContent = text;
    if (idx != null) s.setAttribute("data-diff-index", idx);
    return s;
  }

  function runCompare() {
    const dmp = new diff_match_patch();
    const diffs = dmp.diff_main(preprocess(leftText.value), preprocess(rightText.value));
    dmp.diff_cleanupSemantic(diffs);

    const leftFrag = document.createDocumentFragment();
    const rightFrag = document.createDocumentFragment();
    let count = 0;

    diffs.forEach(function (part) {
      const op = part[0], text = part[1];
      if (op === 0) {
        leftFrag.appendChild(span("diff-equal", text));
        rightFrag.appendChild(span("diff-equal", text));
      } else if (op === -1) {
        leftFrag.appendChild(span("diff-removed", text, count));
        count++;
      } else if (op === 1) {
        rightFrag.appendChild(span("diff-added", text, count));
        count++;
      }
    });

    leftDiff.innerHTML = ""; rightDiff.innerHTML = "";
    leftDiff.appendChild(leftFrag); rightDiff.appendChild(rightFrag);

    state.diffCount = count;
    state.currentDiffIndex = 0;

    // collect + sort nav elements
    diffEls = Array.prototype.slice.call(document.querySelectorAll("[data-diff-index]"));
    diffEls.sort(function (a, b) {
      return parseInt(a.getAttribute("data-diff-index"), 10) - parseInt(b.getAttribute("data-diff-index"), 10);
    });

    // gutters from rendered text
    renderGutter(leftGutter, leftDiff.textContent);
    renderGutter(rightGutter, rightDiff.textContent);
    leftGutter.hidden = leftDiff.textContent === "";
    rightGutter.hidden = rightDiff.textContent === "";

    // swap views
    leftText.style.display = "none"; rightText.style.display = "none";
    leftDiff.hidden = false; rightDiff.hidden = false;
    optionsBar.style.display = "none";

    // header chrome
    if (count > 0) {
      diffBadge.textContent = count + (count === 1 ? " difference found" : " differences found");
      diffBadge.classList.add("has-diff");
      prevBtn.hidden = false; nextBtn.hidden = false; counter.hidden = false;
      navigateToDiff(0);
    } else {
      diffBadge.textContent = "No differences found";
      diffBadge.classList.remove("has-diff");
      prevBtn.hidden = true; nextBtn.hidden = true; counter.hidden = true;
    }
    diffBadge.hidden = false;
  }

  compareBtn.addEventListener("click", function () {
    if (!hasText()) return;
    state.isComparing = true;
    overlay.classList.add("show");
    compareBtn.classList.remove("show");
    setTimeout(function () {
      state.showDiff = true;
      state.isComparing = false;
      overlay.classList.remove("show");
      runCompare();
      updateChrome();
    }, 300);
  });

  // ---- Navigation ----
  function navigateToDiff(index) {
    if (!diffEls.length) return;
    index = Math.max(0, Math.min(index, diffEls.length - 1));
    diffEls.forEach(function (el) { el.classList.remove("is-current"); });
    const el = diffEls[index];
    el.classList.add("is-current");
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    state.currentDiffIndex = index;
    counter.textContent = (index + 1) + " / " + state.diffCount;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === diffEls.length - 1;
  }
  prevBtn.addEventListener("click", function () { navigateToDiff(state.currentDiffIndex - 1); });
  nextBtn.addEventListener("click", function () { navigateToDiff(state.currentDiffIndex + 1); });

  // ---- Synchronised scrolling ----
  function syncFrom(src, tgt) {
    if (!state.syncScroll || isSyncing) return;
    isSyncing = true;
    const denom = src.scrollHeight - src.clientHeight;
    const pct = denom > 0 ? src.scrollTop / denom : 0;
    tgt.scrollTop = pct * (tgt.scrollHeight - tgt.clientHeight);
    setTimeout(function () { isSyncing = false; }, 50);
  }
  leftBody.addEventListener("scroll", function () { syncFrom(leftBody, rightBody); });
  rightBody.addEventListener("scroll", function () { syncFrom(rightBody, leftBody); });

  // ---- Keyboard: Ctrl/Cmd+Enter to compare ----
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && hasText() && !state.showDiff) {
      e.preventDefault();
      compareBtn.click();
    }
  });

  // ---- Toasts ----
  function toast(msg, isError) {
    const wrap = $("toasts");
    const t = document.createElement("div");
    t.className = "toast" + (isError ? " error" : "");
    t.innerHTML = (isError ? "" : ICONS.check) + "<span></span>";
    t.querySelector("span").textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.style.transition = "opacity .2s, transform .2s";
      t.style.opacity = "0"; t.style.transform = "translateY(8px)";
      setTimeout(function () { t.remove(); }, 220);
    }, 2200);
  }

  // ---- Init ----
  setCopyIcon(document.querySelector('.copyBtn[data-side="left"]'), false);
  setCopyIcon(document.querySelector('.copyBtn[data-side="right"]'), false);
  autoGrow(leftText); autoGrow(rightText);
  updateChrome();
})();
</script>
</body>
</html>
